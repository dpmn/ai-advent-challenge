services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    # Qwen2.5-1.5B-Instruct Q4_K_M (~1GB), скачивается с HF при первом старте.
    # Ограничения под 1vCPU/2GB: контекст 2048, один слот, один поток.
    command: >
      -hf Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M
      --host 0.0.0.0
      --port 8081
      --ctx-size 2048
      --threads 1
      --parallel 1
    volumes:
      - llm_cache:/root/.cache/llama.cpp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 20

  app:
    build: ./app
    ports:
      - "8080:8080"
    environment:
      LLM_URL: http://llm:8081
    depends_on:
      llm:
        condition: service_healthy
    restart: unless-stopped

volumes:
  llm_cache:
