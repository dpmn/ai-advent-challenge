[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docent"
version = "0.1.0"
description = "Портабельный CLI-ассистент разработчика: RAG по документации репозитория + git-контекст через MCP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "numpy>=1.24",
    "httpx>=0.24",
    "rich>=13.0",
]

[project.scripts]
docent = "docent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["docent"]
