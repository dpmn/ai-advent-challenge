<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <!-- Left sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>Jarvis</h2>
        <button id="new-session-btn" title="New session">＋</button>
      </div>
      <div id="session-list"></div>

      <!-- Панели: своя область прокрутки, чтобы список сессий не сжимался -->
      <div id="sidebar-panels">
        <!-- SM Status -->
        <details class="settings-section" id="sm-section" style="display:none">
          <summary>State Machine</summary>
          <div id="sm-status" class="sm-indicator">—</div>
        </details>

        <!-- MCP -->
        <details class="settings-section" id="mcp-section">
          <summary>
            MCP
            <label class="mcp-toggle">
              <input type="checkbox" id="mcp-enabled-checkbox">
              <span class="toggle-track"></span>
              <span id="mcp-enabled-label">off</span>
            </label>
          </summary>
          <div id="mcp-servers-list"></div>
          <div class="mcp-add-form">
            <input type="text" id="mcp-add-name" placeholder="name (e.g. grep-app)">
            <input type="text" id="mcp-add-url" placeholder="https://... or stdio cmd">
            <button id="mcp-add-btn">Add server</button>
          </div>
          <div id="mcp-tools-info" class="mcp-tools-info"></div>
        </details>

        <!-- Guard -->
        <details class="settings-section" id="guard-section">
          <summary>
            Guard
            <label class="mcp-toggle">
              <input type="checkbox" id="guard-enabled-checkbox">
              <span class="toggle-track"></span>
              <span id="guard-enabled-label">off</span>
            </label>
          </summary>
          <div id="guard-info" class="mcp-tools-info"></div>
        </details>

        <!-- Gateway -->
        <details class="settings-section" id="gateway-section">
          <summary>
            Gateway
            <label class="mcp-toggle">
              <input type="checkbox" id="gateway-enabled-checkbox">
              <span class="toggle-track"></span>
              <span id="gateway-enabled-label">off</span>
            </label>
          </summary>
          <div id="gateway-info" class="mcp-tools-info"></div>
        </details>

        <!-- Settings -->
        <details class="settings-section" open>
          <summary>Settings</summary>
          <label>Model</label>
          <select id="model-select"></select>

          <label>Temperature</label>
          <div class="slider-row">
            <input type="range" id="temp-slider" min="0" max="2" step="0.05" value="0.7">
            <span id="temp-value">0.70</span>
          </div>

          <label>Max tokens</label>
          <input type="number" id="max-tokens-input" value="2500" min="100" max="16000" step="100">

          <label>Context limit</label>
          <input type="number" id="context-limit-input" value="40000" min="1000" max="200000" step="1000">
        </details>
      </div>
    </aside>

    <!-- Chat area -->
    <main id="chat-area">
      <div id="chat-topbar">
        <button id="sidebar-toggle">☰</button>
        <span id="chat-topbar-title">Jarvis</span>
        <button id="theme-toggle" title="Toggle theme">☾</button>
      </div>
      <div id="messages-container"><div class="inner"></div></div>

      <div id="input-area">
        <div id="input-inner">
          <textarea id="message-input" rows="1" placeholder="Type a message..."></textarea>
          <button id="send-btn">Send →</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
