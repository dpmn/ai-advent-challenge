name: AI Code Review

# Реактивный запуск: при создании/обновлении/переоткрытии PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docent
        run: pip install ./docent

      - name: Build RAG index
        env:
          DOCENT_API_KEY: ${{ secrets.DOCENT_API_KEY }}
        run: docent init

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr diff ${{ github.event.pull_request.number }} > pr.diff

      - name: Run AI review
        env:
          DOCENT_API_KEY: ${{ secrets.DOCENT_API_KEY }}
        run: docent review --diff pr.diff > review.md

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER="<!-- docent-ai-review -->"
          { echo "$MARKER"; echo; cat review.md; } > comment.md
          CID=$(gh api "repos/$REPO/issues/$PR/comments" \
                --jq "map(select(.body | contains(\"$MARKER\"))) | .[0].id // empty")
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -F body=@comment.md
          else
            gh pr comment "$PR" --body-file comment.md
          fi
